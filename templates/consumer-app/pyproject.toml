[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "__NAME__"
version = "0.1.0"
description = "A pw-core full-stack app (FastAPI + SQLAlchemy)."
requires-python = ">=3.12"
dependencies = [
    "__DEPS__",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff~=0.16.0", "pre-commit>=3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Ruff config mirrors the framework's conservative set (see .ai/rules/code-style.md).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "B"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
