[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pw-core"
version = "0.27.0"
description = "Python foundation for LLM apps whose prompts and spend you can actually see — versioned prompts, every call recorded and replayable, budgets, evals, and resumable jobs on one schema; opt-in LLM, database, and FastAPI layers"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mike Farr" }]
keywords = [
    "llm",
    "openrouter",
    "anthropic",
    "fastapi",
    "sqlalchemy",
    "framework",
    "cost-tracking",
    "eval",
    "structured-logging",
    "prompt-versioning",
    "llm-observability",
    "background-jobs",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # pw-foundation is the foundation layer (logging, exceptions, config base, console
    # output, parallel helpers, the Service base, pure utilities, the build gate) and
    # brings its five small dependencies. pyyaml stays for pw-core's own YAML loaders
    # (model router, prompts, versioned config). Everything else — LLM clients and
    # anti-slop guards, HTTP, CLI scaffolding, database, web, jobs, eval — lives behind
    # opt-in extras; see docs/INSTALLATION.md for the matrix.
    "pw-foundation~=1.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# Capability extras — each unlocks a tier of pw-core's framework surface.
# Each composes orthogonally on the foundation base: [db] without LLM, [web]
# without [db], [llm] standalone.
# ---------------------------------------------------------------------------

# HTTP utils: pw_core.utils.url_liveness / pw_core.utils.urls (URL liveness +
# Wayback round-timestamp checks). The lightest network tier — just httpx.
# Pulled in transitively by [llm].
http = ["httpx>=0.28"]

# CLI scaffolding: pw_core.cli.create_cli. Install this to reuse pw-core's
# Typer-based command scaffolding in your own CLI; foundation-only projects
# can equally just depend on typer directly. Pulled in by [jobs].
cli = [
    "typer>=0.27",
    "click>=8.4",
]

# Anti-slop output guards: pw_core.llm.parse (+ json-repair recovery) and
# pw_core.llm.validate (pydantic schema/semantic validation). Pure-Python —
# NO httpx / clients / tenacity / db — so a project can validate LLM output
# (or wire its own transport) without the client stack. The stdlib/pyyaml
# members of pw_core.llm (url_check, prompts, router, safe_apply, recording)
# need no extra at all once pw_core.llm imports lazily.
validate = [
    "json-repair>=0.63",
    "pydantic>=2.13",
]

# LLM tier: pw_core.clients.* (OpenRouter / Brave / Claude Code) on top of
# the anti-slop guards. = [validate] + [http] (clients need httpx) + tenacity
# (retry). [llm] ⊇ [validate], so every existing [llm]/[full]/[tracking]
# consumer keeps the same dependency closure (mirrors [tracking] = [db,llm]).
# Note: tracked_call records to the DB, so it additionally needs [tracking]
# (= [db,llm]); importing it without [db] raises a friendly 'tracking' error.
llm = [
    "pw-core[validate,http]",
    "tenacity>=9.1",
]

# Database layer: pw_core.db.*, pw_core.alembic, fully-functional cost guards
# (BudgetRepo / CostRateRepo). Without [db], pw_core.budget.check_budget still
# imports and short-circuits gracefully; pw_core.db.* and pw_core.alembic
# raise ImportError. SQLite needs no driver extra (stdlib).
db = [
    "sqlalchemy>=2.0.52",
    "alembic>=1.19",
]

# FastAPI web layer: pw_core.web.app_factory, error pages, markdown,
# pagination, templates.
web = [
    "fastapi>=0.141",
    "jinja2>=3.1.6",
    "uvicorn[standard]>=0.52",
]

# Job tracker: pw_core.jobs.* (state machine, step history, worker leases)
# and the pw-jobs CLI. Requires [db] for persistence and [cli] for the CLI;
# pydantic backs job-argument schema validation in pw_core.jobs.registry.
# [tracking] is required, not optional: jobs._schema imports
# llm.tracking.schema at module scope so job-attribution FKs land on the shared
# metadata, so pw_core.jobs cannot import without it.
jobs = ["pw-core[db,cli,tracking]", "pydantic>=2.13"]

# DB-backed LLM run tracking: pw_core.llm.tracking.* and pw_core.llm.cache.*
# (one row per call with prompts, tokens, cost, validations, job
# attribution). Requires [db] for persistence and [llm] for the parse/retry
# machinery it records around (tracking code itself uses tenacity).
tracking = ["pw-core[db,llm]"]

# Admin dashboard sub-app: pw_core.web.llm_admin (runs, costs, jobs, cache
# stats, budgets). Requires [web,tracking].
admin = ["pw-core[web,tracking]"]

# Eval harness: pw_core.eval.* (golden-set replay, structured-diff and
# LLM-judge comparators) and the pw-eval CLI. Requires [tracking,jobs];
# jinja2 renders the HTML report (EvalReport.write_html, pw-eval run --output).
eval = ["pw-core[tracking,jobs]", "jinja2>=3.1.6"]

# OpenTelemetry export: pw_core.llm.tracking.otel and the pw-export CLI send
# llm_runs to any OTLP/HTTP backend as GenAI spans. Requires [tracking] (the
# runs) and [cli] (pw-export). Opt-in tooling, so [full] does not include it.
otel = [
    "pw-core[tracking,cli]",
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]

# ---------------------------------------------------------------------------
# Database driver extras — pick one per consumer (mutually exclusive).
# ---------------------------------------------------------------------------
mysql = ["pymysql>=1.2"]
postgres = ["psycopg[binary]>=3.3"]

# ---------------------------------------------------------------------------
# Other capability extras
# ---------------------------------------------------------------------------

# Redis-backed cache region: pw_core.cache (with graceful no-op fallback
# when Redis is unreachable).
redis = ["dogpile.cache>=1.5", "redis>=8.1"]

# Per-IP rate limiting on FastAPI routes. Requires [web].
ratelimit = [
    "pw-core[web]",
    "slowapi>=0.1.10",
]

# Strict JSON Schema validation in pw_core.llm.validate (stdlib jsonschema
# rather than the lighter Pydantic path).
jsonschema = ["jsonschema>=4.26"]

# Article fetch + extract: pw_core.utils.article_fetch (title, body,
# publish-date with Wayback Machine fallback for paywalled URLs). tenacity
# drives the Wayback retry loop.
articles = [
    "trafilatura>=2.2",
    "htmldate>=1.10",
    "tenacity>=9.1",
]

# Intent-named meta-extra: "I want to crawl/fetch web pages." Composes the
# fetch+extract stack ([articles]) with the URL-utils tier ([http]) —
# article_fetch imports pw_core.utils.urls, which needs httpx. Exists so a
# consumer asking "how do I crawl?" gets one named line instead of having to
# know the composition. Front-end serving is a different intent: [web].
crawl = ["pw-core[http,articles]"]

# Direct Anthropic API client (pw_core.clients.anthropic). Provides a
# multimodal-capable alternative to the OpenRouter and Claude Code
# transports for consumers that want the official SDK's vision support
# and direct usage / cache-token reporting.
# <1.0: SDK 1.0 removed temperature/top_p/top_k from messages.create().
anthropic = ["anthropic>=0.105,<1.0"]

# Perceptual-hash image dedup: pw_core.utils.phash (DCT-based phash via
# ImageHash + Pillow). Used by document-processing pipelines to detect
# repeated page decorations (header logos, footer marks) and re-encoded
# duplicates that sha256 would miss.
image-phash = [
    "ImageHash>=4.3.2",
    "Pillow>=12.3",  # Security floor: 12.3.0 fixed the 2026 CVE batch.
]

# ---------------------------------------------------------------------------
# Meta-extra for full-stack apps that want the whole framework.
# Add the dialect driver ([mysql]/[postgres]) and any optional capability
# extras ([articles]) separately.
# ---------------------------------------------------------------------------
full = [
    "pw-core[db]",
    "pw-core[web]",
    "pw-core[llm]",
    "pw-core[cli]",
    "pw-core[jobs]",
    "pw-core[tracking]",
    "pw-core[admin]",
    "pw-core[eval]",
    "pw-core[redis]",
    "pw-core[ratelimit]",
    "pw-core[jsonschema]",
]

# ---------------------------------------------------------------------------
# Dev / test extras
# ---------------------------------------------------------------------------
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
    "factory-boy>=3.3.3",
    "ruff~=0.16.0",
    "mypy~=2.3.0",
    "types-PyYAML",
    "types-PyMySQL",
    "types-jsonschema",
    "types-nanoid",
    "pre-commit>=4.6",
    "build>=1.2",
]
test-containers = [
    "testcontainers[mysql]>=4.15",
]

[project.urls]
Documentation = "https://github.com/phierceweb/pw-core/blob/main/src/pw_core/docs/modules.md"
Repository = "https://github.com/phierceweb/pw-core"
Changelog = "https://github.com/phierceweb/pw-core/blob/main/CHANGELOG.md"
Issues = "https://github.com/phierceweb/pw-core/issues"

[project.scripts]
pw-jobs = "pw_core.cli.jobs:app"
pw-export = "pw_core.cli.export:main"
pw-eval = "pw_core.eval.cli:main"

[project.entry-points.pytest11]
pw_core = "pw_core.testing.fixtures"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pw_core" = ["docs/*.md", "docs/recipes/*.md", "rules/*.md", "py.typed"]
"pw_core.web.llm_admin" = ["templates/*.html"]
"pw_core.web.jobs_admin" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]   # don't collect templates/consumer-*/tests/ (they hold __PKG__ tokens)
pythonpath = ["."]

# ---------------------------------------------------------------------------
# Type-check config — mypy
# ---------------------------------------------------------------------------
# Non-strict: annotated code is checked, untyped defs are not forced. `files`
# scopes a bare `mypy` to the same surface CI checks.
[tool.mypy]
python_version = "3.12"
# A directory expands to *.py only, so bin/'s extensionless entry points must be
# named one by one; scripts_are_modules stops them all resolving to __main__.
files = [
    "src",
    "bin",
    "bin/new-consumer",
    "bin/pw-eval",
    "bin/pw-jobs",
    "bin/verify-bare-install",
]
scripts_are_modules = true

# ---------------------------------------------------------------------------
# Lint config — ruff
# ---------------------------------------------------------------------------
# Conservative set: what ruff catches by default (E, W, F) plus bugbear (B).
# Layout is enforced separately by `ruff format` (pre-commit + CI). isort (I)
# and pyupgrade (UP) stay off. E501 stays off because the formatter cannot
# break long string literals — Jinja blocks, markdown tables in docstrings, SQL.
[tool.ruff]
line-length = 100
target-version = "py312"
# Same reason as [tool.mypy] files: directory traversal skips extensionless scripts.
extend-include = [
    "bin/new-consumer",
    "bin/pw-eval",
    "bin/pw-jobs",
    "bin/verify-bare-install",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "B",   # flake8-bugbear (common bugs / antipatterns)
]
ignore = [
    "E501",  # line too long — defer to a separate formatting pass
    "B008",  # function call in default arg — common in FastAPI / Typer
    "B904",  # raise-from — `raise X from y` discipline pre-dates this lint
]

[tool.ruff.lint.per-file-ignores]
# Tests may use `assert False` (B011) in must-not-reach branches.
"tests/**/*.py" = ["B011"]
