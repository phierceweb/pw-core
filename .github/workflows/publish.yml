# Builds and publishes the package to PyPI when a release tag (v*) is pushed —
# tags are the public consumption surface; main carries no stability promise.
# Run by hand (workflow_dispatch), it rehearses the release on TestPyPI instead.
#
# The `build` job builds the sdist/wheel and runs twine check; the `test` job
# runs every job in test.yml on the same sha; the publish jobs wait for both and
# upload via OIDC Trusted Publishing — the trusted publishers are registered on
# pypi.org and test.pypi.org (owner phierceweb, repo pw-core, workflow
# publish.yml, environments `pypi` and `testpypi`), so no API-token secret lives
# in the repo.
name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; the publish jobs ask for the OIDC token they need.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      # Fail fast when the pushed tag doesn't match pyproject's version —
      # a mismatched build otherwise reaches PyPI and 400s on filename reuse.
      - name: verify tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION != pyproject version $PKG_VERSION — bump pyproject (and CHANGELOG) before tagging"
            exit 1
          fi
      # TestPyPI also accepts a filename only once, so each rehearsal uploads X.Y.Z.devN.
      - name: stamp a dev version for TestPyPI
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i -E "s/^version = \"([^\"]+)\"$/version = \"\1.dev${GITHUB_RUN_NUMBER}\"/" pyproject.toml
          grep -E '^version = ".+\.dev[0-9]+"$' pyproject.toml
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    uses: ./.github/workflows/test.yml

  publish:
    if: github.event_name == 'push'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-test:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
